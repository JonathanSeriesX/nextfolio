<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The site's own motif: a segmented control with its thumb parked left.
       Kept to three shapes so it survives being drawn at 16px. Colours are
       the light-theme accent and paper from globals.css. -->
